<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Calendar</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c1f26;--mut:#6b7280;--line:#e3e6eb;--acc:#16a34a;--accfg:#fff;--today:#dcfce7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1a1e25;--fg:#eceff4;--mut:#9aa3b2;--line:#2a303a;--acc:#22c55e;--accfg:#06240f;--today:#14321f}}
:root[data-theme="dark"]{--bg:#111418;--card:#1a1e25;--fg:#eceff4;--mut:#9aa3b2;--line:#2a303a;--acc:#22c55e;--accfg:#06240f;--today:#14321f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
h1{font-size:20px;margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 12px}
button.pri,.seg button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.seg{display:flex}
.seg button{border-radius:0}
.seg button:first-child{border-radius:10px 0 0 10px}
.seg button:last-child{border-radius:0 10px 10px 0}
.nav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav b{flex:1;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;color:var(--mut);font-size:13px;padding:4px 0}
.day{min-height:78px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:start;min-width:0;overflow:hidden}
.day.empty{background:none;border:none;cursor:default}
.day.today{background:var(--today);border-color:var(--acc)}
.day.sel{outline:2px solid var(--acc)}
.labs{display:flex;flex-direction:column;gap:2px;width:100%}
.lab{font-size:10.5px;line-height:1.15;background:var(--today);border-left:3px solid var(--acc);border-radius:4px;padding:1px 3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.panel{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h2{font-size:16px;margin:0 0 10px}
.item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.item small,.ex small{color:var(--mut);display:block;margin-top:2px}
.item button,.ex>button{padding:4px 10px;color:#dc2626;align-self:flex-start}
.row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.row>div{flex:1 1 40%}
input,select,textarea{font:inherit;width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.none{color:var(--mut);font-size:14px}
.stat{color:var(--mut);font-size:13px;margin:10px 2px}
.bwl{font-size:14px;padding:4px 0 8px}
#wiz{margin-top:14px}
.wh{display:flex;justify-content:space-between;margin-bottom:10px}
.q{font-weight:600;margin:10px 0 6px}
.ex{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.ex>div{flex:1}
.lbl{font-size:12px;color:var(--mut);margin-top:6px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600}
tr[data-k]{cursor:pointer}
tr[data-k]:hover{background:var(--bg)}
tr.first td{border-top:2px solid var(--line)}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tools button{flex:1 1 auto}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0}input[type=checkbox]{width:auto}
.item button.ed,.ex>button.ed{color:var(--fg)}
.bt{display:flex;gap:6px;align-self:flex-start}
.item>div:first-child{flex:1;min-width:0}
.ss{width:100%;box-sizing:border-box;align-self:stretch;border:2px solid var(--acc);border-radius:12px;padding:6px 12px 10px;margin:10px 0}.sst{display:block;color:var(--acc);font-weight:700}.ssh{display:flex;justify-content:space-between;align-items:center;gap:8px}.ssh .sst{flex:1}.ss .xl:first-child{margin-top:2px}
.xl{display:block;margin:6px 0}.xl u{color:var(--fg);text-underline-offset:2px}.xd{display:block;color:var(--mut)}
.lab.pl{background:none;border:1px dashed var(--mut);border-left:3px solid var(--mut);color:var(--mut)}
.pc{margin-top:12px;padding:10px;border:1px dashed var(--line);border-radius:10px}.pc small{display:block;color:var(--mut);margin:6px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.tile b{font-size:20px;display:block}.tile span{color:var(--mut);font-size:12px;display:block}.tile small{color:var(--mut);font-size:11px;display:block;margin-top:2px}
.stw{position:relative}.stw svg{width:100%;height:auto;display:block;touch-action:pan-y}.stw svg text{fill:var(--mut);font-size:11px}.stw svg text.lv{fill:var(--fg);font-weight:600}
.stt{position:absolute;top:0;display:none;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.4;box-shadow:0 2px 8px rgba(0,0,0,.18);white-space:nowrap;z-index:2}
.tr2{position:relative;display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}.tr2 span{width:90px;flex:none}.tr2 i{display:block;height:8px;border-radius:4px;background:var(--acc)}.tr2 b{font-weight:600}
em{color:var(--acc);font-style:normal;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🏋️ Workout Calendar</h1>
    <div class="seg"><button id="vc" class="on">Calendar</button><button id="vl">Log</button><button id="ve">Exercises</button><button id="vp">Plan</button><button id="vs">Stats</button></div></header>
  <div class="tools"><button class="pri" id="retro">＋ Log past workout</button><button id="goto">📅 Go to date</button></div>
  <div class="tools"><button id="ghb"></button><button id="fsb"></button></div>
  <div class="panel" id="dp" style="display:none;margin:0 0 12px"><div class="lbl" id="dpl" style="margin:0 0 6px"></div>
    <div class="row" style="margin:0"><input type="date" id="dpi" style="flex:1"><button class="pri" id="dpg">Go</button><button id="dpx">✕</button></div></div>
  <div id="cal">
    <div class="nav">
      <button id="prev" aria-label="Previous month">‹</button>
      <b id="title"></b>
      <button id="today">Today</button>
      <button id="next" aria-label="Next month">›</button>
    </div>
    <div class="grid" id="dows"></div>
    <div class="grid" id="grid" style="margin-top:4px"></div>
    <div class="stat" id="stat"></div>
    <div class="panel">
      <h2 id="ptitle"></h2>
      <div id="list"></div>
      <div id="wiz"></div>
    </div>
  </div>
  <div id="logv" style="display:none"></div>
  <div id="dbv" style="display:none"></div>
  <div id="plv" style="display:none"></div>
  <div id="stv" style="display:none"></div>
</div>
<script>
var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var KEY="workout-calendar-v1",LK="workout-calendar-lib-v1",BK="workout-calendar-bw-v1";
var PATS=["Pull","Push","Squat","Hinge","Full body"];
var LIB={
Pull:["Pull ups","Rows","Cable pulls","Lat pulldown","Face pull","Bicep curls","Rear delt pulls","Concentration curls","Shrug"],
Push:["Bench press","Overhead press","Push-up","Dip","Chest fly","Lateral raise","Triceps extension"],
Squat:["Squat","Lunge","Split squat","Step-up","Leg press","Knee extension"],
Hinge:["Deadlift","Romanian deadlift","Hip thrust","Good morning","Back extension","Leg curl","Swing"]};
var EQ=["Machine","Barbell","Dumbbells","Kettlebell","Cable","Bar","Pulley","Bands","Bodyweight"];
function ld(k,d){try{return JSON.parse(localStorage.getItem(k)||"null")||d}catch(e){return d}}
var data=ld(KEY,{}),bw=ld(BK,{}),S=ld(LK,{types:[],mv:{},eq:[]});
S.types=S.types||[];S.mv=S.mv||{};S.eq=S.eq||[];S.ex=S.ex||[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(BK,JSON.stringify(bw));localStorage.setItem(LK,JSON.stringify(S))}catch(e){}fsQueue();if(typeof ghQueue=="function")ghQueue()}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(k){var p=k.split("-");return MONTHS[+p[1]-1].slice(0,3)+" "+(+p[2])+", "+p[0]}
var now=new Date(),cur=new Date(now.getFullYear(),now.getMonth(),1),sel=iso(now),W=null,adding=null,mode="cal";
var $=function(i){return document.getElementById(i)};
$("dows").innerHTML=DOW.map(function(d){return '<div class="dow">'+d+'</div>'}).join("");

function nm(x){return x.cat?(x.cat+(x.sub?" · "+x.sub:"")):x.type}
function exLine(e,ss){var p=[];
  if(e.kg)p.push(esc(e.kg)+" kg");
  if(e.sets&&!e.g)p.push(esc(e.sets)+(e.sets==1?" set":" sets"));
  if(e.t)p.push(esc(e.t)+" s hold"+(e.iso?" each":""));
  if(e.reps)p.push(esc(e.reps)+(e.reps==1?" rep":" reps")+(e.iso?" each":""));
  if(e.rest)p.push("rest "+esc(e.rest)+(e.ru=="m"?" min":" s"));
  if(e.stars)p.push(esc(e.stars).replace(/\*/g,"★"));
  var g=[e.eq,e.pos,e.grip,e.det].filter(Boolean).map(esc).join(" · ");
  return '<span class="xl"><u>'+esc(e.name)+(g?" · "+g:"")+(e.iso?" · <em>isolateral</em>":"")+'</u>'+(p.length?'<span class="xd">'+p.join(" · ")+'</span>':"")+'</span>'}
function ssTitle(e){return 'Superset · '+esc(e.gr||e.sets||"")+(e.gr==1?" round":" rounds")}
function det(x){var d=[],l=[];
  if(x.dur)d.push(x.dur+" min");if(x.dist)d.push(x.dist+" km");
  if(d.length)l.push('<span class="xl">'+esc(d.join(" · "))+'</span>');
  if(x.ex){var gi=null;x.ex.forEach(function(e,i){
    if(e.g&&e.g!==gi)l.push('<div class="ss"><span class="sst">'+ssTitle(e)+'</span>');
    if(!e.g&&gi)l.push('</div>');
    if(e.g&&gi&&e.g!==gi){}
    l.push(exLine(e));gi=e.g||null;
    var nx2=x.ex[i+1];if(gi&&(!nx2||nx2.g!==gi)){l.push('</div>');gi=null}})}
  if(x.notes)l.push('<span class="xl"><i>'+esc(x.notes)+'</i></span>');
  return l.join("")}

function render(){
  var y=cur.getFullYear(),m=cur.getMonth();
  $("title").textContent=MONTHS[m]+" "+y;
  var first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),h="",total=0,active=0;
  for(var i=0;i<first;i++)h+='<div class="day empty"></div>';
  for(var d=1;d<=days;d++){
    var k=iso(new Date(y,m,d)),w=data[k]||[];
    if(w.length){active++;total+=w.length}
    h+='<button class="day'+(k===iso(now)?' today':'')+(k===sel?' sel':'')+'" data-k="'+k+'"><span>'+d+'</span><span class="labs">'+
      w.slice(0,2).map(function(x){return '<span class="lab">'+esc(nm(x))+'</span>'}).join("")+
      (w.length>2?'<span class="lab">+'+(w.length-2)+' more</span>':'')+(!w.length&&PLAN[k]?'<span class="lab pl">'+esc(PLAN[k].a||PLAN[k].t)+'</span>':'')+'</span></button>';
  }
  $("grid").innerHTML=h;
  $("stat").textContent=total?("This month: "+total+(total>1?" workouts":" workout")+" on "+active+(active>1?" days":" day")):"No workouts logged this month yet";
  $("cal").style.display=mode=="cal"?"":"none";
  $("logv").style.display=mode=="log"?"":"none";$("dbv").style.display=mode=="db"?"":"none";$("plv").style.display=mode=="plan"?"":"none";$("vp").className=mode=="plan"?"on":"";$("stv").style.display=mode=="stats"?"":"none";$("vs").className=mode=="stats"?"on":"";
  $("vc").className=mode=="cal"?"on":"";$("vl").className=mode=="log"?"on":"";$("ve").className=mode=="db"?"on":"";
  if(mode=="cal"){panel();wiz()}else if(mode=="log")logRender();else if(mode=="plan")planRender();else if(mode=="stats")statRender();else dbRender();
}
function panel(){
  var p=sel.split("-");
  $("ptitle").textContent="Workouts on "+MONTHS[+p[1]-1]+" "+(+p[2])+", "+p[0];
  var w=data[sel]||[];
  $("list").innerHTML=(bw[sel]?'<div class="bwl">⚖️ Body weight: '+esc(bw[sel])+' kg</div>':'')+
    (w.length?w.map(function(x){
      return '<div class="item"><div><b>'+esc(nm(x))+'</b><small>'+det(x)+'</small></div><div class="bt"><button class="ed" data-edit="'+x.id+'">Edit</button><button data-del="'+x.id+'">Delete</button></div></div>';
    }).join(""):'<div class="none">No workout logged for this date yet.</div>')+planCard();
}
function logRender(){
  var seen={},ks=Object.keys(data).concat(Object.keys(bw)).filter(function(k){if(seen[k])return false;seen[k]=1;return (data[k]&&data[k].length)||bw[k]}).sort().reverse();
  if(!ks.length){$("logv").innerHTML='<div class="none">Nothing logged yet.</div>';return}
  var h='<div class="tw"><table><thead><tr><th>Date</th><th>Workout</th><th>Details</th><th>Body weight</th></tr></thead><tbody>';
  ks.forEach(function(k){
    var w=data[k]||[],n=Math.max(w.length,1);
    for(var i=0;i<n;i++){var x=w[i];
      h+='<tr data-k="'+k+'"'+(i==0?' class="first"':'')+'><td>'+(i==0?fmt(k):'')+'</td><td>'+(x?'<b>'+esc(nm(x))+'</b>':'—')+'</td><td>'+(x?det(x):'')+'</td><td>'+(i==0&&bw[k]?esc(bw[k])+' kg':'')+'</td></tr>';
    }
  });
  $("logv").innerHTML=h+'</tbody></table></div>';
}

function q(t){return '<div class="q">'+esc(t)+'</div>'}
function libFor(s){return (LIB[s]||[]).concat(S.mv[s]||[])}
function eqList(){return EQ.concat(S.eq)}
function pick(act,ph,arr,curv,addlbl){
  return '<select data-s="'+act+'"><option value="">'+ph+'</option>'+arr.map(function(t){return '<option'+(t===curv?' selected':'')+'>'+esc(t)+'</option>'}).join("")+(addlbl?'<option value="__new">+ '+addlbl+'</option>':'')+'</select>'}
function addrow(kind,ph){return adding==kind?'<div class="row"><input id="na" placeholder="'+ph+'"><button data-a="add" data-k="'+kind+'">Add</button></div>':""}
function newW(){return {id:null,cat:null,sub:null,ex:[],notes:"",bw:null,f:null,fi:-1}}
function nx(e){var o=JSON.parse(JSON.stringify(e));if(o.rest&&o.ru!="m")o.rest=String(Math.round(o.rest/60*100)/100);o.ru="m";return o}
function names(){var o={},r=[];function a(n){if(n&&!o[n]){o[n]=1;r.push(n)}}
  var pp=W.cat=="Endurance"?"Core":W.sub;libFor(pp).forEach(a);S.ex.forEach(function(t){if(t.pat==pp)a(t.name)});Object.keys(data).forEach(function(k){data[k].forEach(function(x){(x.ex||[]).forEach(function(e){if(e.pat==pp)a(e.name)})})});return r}
function poss(){var r=["Seated","Standing","Lying","Incline","Kneeling","Bent over","Hanging"];Object.keys(data).forEach(function(k){data[k].forEach(function(x){(x.ex||[]).forEach(function(e){if(e.pos&&r.indexOf(e.pos)<0)r.push(e.pos)})})});return r}
function exRow(e,i){return '<div class="ex"><div>'+exLine(e)+'</div><button class="ed" data-a="edx" data-i="'+i+'">Edit</button><button data-a="rmex" data-i="'+i+'" aria-label="Remove">✕</button></div>'}
function exList(){if(!W.ex.length)return "";var h=q("Exercises so far"),i=0,ex=W.ex;
  while(i<ex.length){var e=ex[i];
    if(!e.g){h+=exRow(e,i);i++;continue}
    var g=e.g;h+='<div class="ss"><div class="ssh"><span class="sst">'+ssTitle(e)+'</span><label class="none">Rounds <input type="number" min="1" step="1" data-gr="'+esc(g)+'" value="'+esc(e.gr||e.sets||"")+'" style="width:60px"></label></div>';
    while(i<ex.length&&ex[i].g===g){h+=exRow(ex[i],i);i++}
    h+='<button data-a="addss" data-g="'+esc(g)+'" style="width:100%;margin-top:6px">+ Add exercise to this superset</button></div>'}
  return h}
function exForm(){var f=W.f,N='type="number" min="0" step="any" inputmode="decimal"';
  function F(k,l,x){return '<div><div class="lbl">'+l+'</div><input data-f="'+k+'" '+x+' value="'+esc(f[k]||"")+'"></div>'}
  function dl(id,a){return '<datalist id="'+id+'">'+a.map(function(t){return '<option value="'+esc(t)+'">'}).join("")+'</datalist>'}
  return q((f.g?"Superset · ":"")+(W.fi>=0?"Edit exercise":"New exercise"))+dl("mvl",names())+dl("eql",eqList())+dl("posl",poss())+
  '<div class="row">'+F("name","Movement",'list="mvl"')+F("eq","Equipment (optional)",'list="eql"')+'</div>'+
  '<div class="row">'+F("pos","Body position",'list="posl"')+'<div><div class="lbl">Wrist grip</div><select data-f="grip">'+["","Pronated","Supinated","Neutral"].map(function(g){return '<option value="'+g+'"'+(f.grip==g?' selected':'')+'>'+(g||"—")+'</option>'}).join("")+'</select></div>'+'</div><div class="row">'+F("det","Details (e.g. narrow grip)","")+'</div>'+
  '<label class="chk"><input type="checkbox" data-f="iso"'+(f.iso?' checked':'')+'> Isolateral (one side at a time)</label>'+
  '<div class="row">'+(f.g?(W.ex.some(function(e,i){return e.g===f.g&&i!==W.fi})?'':F("gr","Superset rounds",N)):F("sets","Sets",N))+F("reps","Reps"+(f.iso?" (each)":""),N)+F("t","Hold time (sec, optional)",N)+F("kg","Weight (kg)",N)+F("rest","Rest after (min)",N)+'</div>'+
  F("stars","Progress marks (e.g. ***)","")+
  '<div class="row"><button class="pri" data-a="savex" style="flex:1">'+(W.fi>=0?"Save changes":"Add exercise")+'</button><button data-a="xcancel">Cancel</button></div>'}
function foot(){
  var ok=!(W.cat=="Strength"&&!W.ex.length);
  return '<textarea id="notes" rows="2" style="margin-top:10px" placeholder="Notes (optional)">'+esc(W.notes||"")+'</textarea>'+
  '<div class="lbl">Body weight today (kg, optional)</div><input id="bw" type="number" min="0" step="any" value="'+esc(W.bw!=null?W.bw:(bw[sel]||""))+'">'+
  '<div class="row"><button class="pri" data-a="save" style="width:100%"'+(ok?'':' disabled')+'>'+(W.id?"Save changes":"Save workout")+'</button></div>'}
function wiz(){
  var h="";
  if(!W){h='<button class="pri" data-a="start">+ Log workout</button>'}
  else{
    var c=W.cat,s=W.sub;
    h='<div class="wh">'+(W.id?'<b>Editing workout</b>':'<button data-a="back">← Back</button>')+'<small class="none">'+fmt(sel)+'</small><button data-a="cancel">Cancel</button></div>';
    if(!c){h+=q("What type of workout?")+pick("cat","Choose type…",["Strength","Endurance","Flexibility"].concat(S.types),"","New type…")+addrow("type","New type name")}
    else if(c=="Endurance"&&!s){h+=q("Which activity?")+pick("sub","Choose activity…",["Running","Walking","Jump rope","Cycling","Swimming"])}
    else if(c=="Strength"){
      h+=q("Workout type")+pick("sub","Choose type…",PATS,s);
      if(s){h+=exList();
        if(W.f)h+=exForm();
        else h+='<div class="row"><button data-a="newex" style="flex:1">+ Add exercise</button><button data-a="newss" style="flex:1">+ Add superset</button></div>'+foot()}
    }else{
      var en=c=="Endurance";
      h+=q(en?s+": how long or how far?":c)+'<div class="row"><div><div class="lbl">Minutes</div><input id="dur" type="number" min="0" step="any" value="'+esc(W.dur||"")+'"></div>'+
      (en?'<div><div class="lbl">Distance (km)</div><input id="dist" type="number" min="0" step="any" value="'+esc(W.dist||"")+'"></div>':'')+'</div>'+
      (en?exList()+(W.f?exForm():'<div class="row"><button data-a="newex" style="flex:1">+ Add core exercise</button><button data-a="newss" style="flex:1">+ Add superset</button></div>'):'')+(W.f?'':foot());
    }
  }
  $("wiz").innerHTML=h;
  var na=$("na");if(na)na.focus();
}
$("wiz").onchange=function(e){
  var t=e.target,a=t.dataset.s,v=t.value;

function eachEx(fn){Object.keys(data).sort().forEach(function(d){data[d].forEach(function(w){(w.ex||[]).forEach(function(e){fn(e.pat||w.sub,e,d)})})})}
function tpl(pat,name){var lu=null,tt=null;
  S.ex.forEach(function(t){if(t.pat==pat&&t.name==name)tt=t});
  eachEx(function(p,e){if(p==pat&&e.name==name)lu=e});return tt||lu}
function allEx(){var m={};
  function get(p,n){var k=p+"|"+n;return m[k]=m[k]||{pat:p,name:n,eq:{},pos:{},grip:{},n:0,last:null,lastd:"",user:false}}
  function fill(r,e){["eq","pos","grip"].forEach(function(f){if(e[f])r[f][e[f]]=1})}
  PATS.forEach(function(p){libFor(p).forEach(function(n){get(p,n)})});
  S.ex.forEach(function(t){var r=get(t.pat,t.name);r.user=true;fill(r,t)});
  eachEx(function(p,e,d){var r=get(p,e.name);r.n++;fill(r,e);r.last=e;r.lastd=d});
  return m}

    S.seeded.push(g[0]);ch=true});
  Object.keys(data).forEach(function(k){data[k].forEach(function(w){if(w.iv){(w.ex||[]).forEach(function(e){e.g="g"+w.id;e.gr="3"});delete w.iv;ch=true}(w.ex||[]).forEach(function(e){var m=!e.t&&/^(?:(.*?) · )?(\d+) s hold$/.exec(e.det||"");if(m){e.det=m[1]||"";e.t=m[2];ch=true}})})});
  if(ch)save()}
// ---- Data folder: saves everything to <chosen folder>/data/workout-data.json ----
var FH=null,fsState=window.showDirectoryPicker?"none":"unsupported",wT=null,bkDay="";
function idb(mode,fn){return new Promise(function(res,rej){var r=indexedDB.open("workout-fs",1);r.onupgradeneeded=function(){r.result.createObjectStore("h")};r.onerror=function(){rej(r.error)};
  r.onsuccess=function(){var tx=r.result.transaction("h",mode),q;try{q=fn(tx.objectStore("h"))}catch(x){return rej(x)}tx.oncomplete=function(){res(q&&q.result)};tx.onerror=function(){rej(tx.error)}}})}
function snap(){return JSON.stringify({version:1,saved:new Date().toISOString(),data:data,bodyWeight:bw,settings:S},null,1)}
async function put(dir,name,txt){var f=await dir.getFileHandle(name,{create:true}),w=await f.createWritable();await w.write(txt);await w.close()}
async function fsWrite(){var d=await FH.getDirectoryHandle("data",{create:true}),t=snap();await put(d,"workout-data.json",t);
  var day=iso(new Date());var b=await d.getDirectoryHandle("backups",{create:true});await put(b,"workout-data-"+day+".json",t);bkDay=day}
function fsQueue(){if(fsState!="on")return;clearTimeout(wT);wT=setTimeout(function(){fsWrite().catch(function(){fsState="lost";fsUi()})},250)}
function uni(a,b){(b||[]).forEach(function(x){if(a.indexOf(x)<0)a.push(x)});return a}
function fsMerge(o){
  var od=o.data||{};Object.keys(data).forEach(function(k){var L=od[k]=od[k]||[];data[k].forEach(function(x){if(!L.some(function(y){return y.id==x.id}))L.push(x)})});data=od;
  var ob=o.bodyWeight||{};Object.keys(bw).forEach(function(k){if(ob[k]==null)ob[k]=bw[k]});bw=ob;
  var os=o.settings||{};os.seeded=uni(os.seeded||[],S.seeded);os.types=uni(os.types||[],S.types);os.eq=uni(os.eq||[],S.eq);os.mv=os.mv||{};Object.keys(S.mv).forEach(function(k){os.mv[k]=uni(os.mv[k]||[],S.mv[k])});
  var ex=os.ex||[];(S.ex||[]).forEach(function(t){if(!ex.some(function(u){return u.pat==t.pat&&u.name==t.name}))ex.push(t)});os.ex=ex;S=os}
async function fsLoad(first){
  var d=await FH.getDirectoryHandle("data",{create:true}),txt="";
  try{txt=await (await (await d.getFileHandle("workout-data.json")).getFile()).text()}catch(e){}
  var o=null;try{o=txt.trim()?JSON.parse(txt):null}catch(e){throw new Error("bad json")}
  if(o){
    if(first)fsMerge(o);
    else{data=o.data||{};bw=o.bodyWeight||{};S=o.settings||{types:[],mv:{},eq:[]};S.types=S.types||[];S.mv=S.mv||{};S.eq=S.eq||[];S.ex=S.ex||[]}
  }
  seedAll();fsState="on";try{localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(BK,JSON.stringify(bw));localStorage.setItem(LK,JSON.stringify(S))}catch(e){}
  await fsWrite();fsUi();render()}
function fsUi(){var b=$("fsb"),t={unsupported:["⚠️ Saving to a folder needs Chrome or Edge (open this file in one of them)",0],none:["📁 Choose data folder — saves your workouts to files",1],
  ask:["🔓 Reconnect data folder ("+(FH?FH.name:"")+")",1],lost:["⚠️ Data folder disconnected — tap to reconnect",1],on:["✅ Saving to “"+(FH?FH.name:"")+"/data”",0]}[fsState];
  b.textContent=t[0];b.className=t[1]?"pri":"";b.disabled=fsState=="unsupported";b.title=fsState=="on"?"Click to switch folder":""}
$("fsb").onclick=async function(){
  try{
    if((fsState=="ask"||fsState=="lost")&&FH){if(await FH.requestPermission({mode:"readwrite"})=="granted"){await fsLoad(false);return}}
    var h=await showDirectoryPicker({mode:"readwrite"});FH=h;try{await idb("readwrite",function(s){return s.put(h,"dir")})}catch(x){}await fsLoad(true)
  }catch(e){if(e&&e.name!="AbortError"){fsState="lost";fsUi();alert("Could not use the folder: "+(e.message||e))}}};
(async function(){fsUi();if(fsState=="unsupported")return;
  try{var h=await idb("readonly",function(s){return s.get("dir")});if(!h)return;FH=h;
    if(await h.queryPermission({mode:"readwrite"})=="granted")await fsLoad(false);else{fsState="ask";fsUi()}}catch(e){fsState="none";fsUi()}})();
// ---- GitHub sync: loads and saves data/workout-data.json in the GitHub repository ----
var GH={owner:"orbelloelias-del",repo:"workout",path:"data/workout-data.json",branch:"main"},ghTok=null,ghSha=null,ghT=null,ghBusy=false,ghAgain=false,ghState="off";
try{ghTok=localStorage.getItem("workout-gh-token")}catch(e){}
function ghApi(p,o){o=o||{};o.headers=Object.assign({"Accept":"application/vnd.github+json"},ghTok?{"Authorization":"Bearer "+ghTok}:{},o.headers||{});o.cache="no-store";
  return fetch("https://api.github.com/repos/"+GH.owner+"/"+GH.repo+p,o)}
function b64(t){var u=new TextEncoder().encode(t),s="";for(var i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
async function ghGetSha(){var r=await ghApi("/contents/data?ref="+GH.branch);if(!r.ok)throw new Error("GitHub "+r.status);
  var f=(await r.json()).find(function(x){return x.path==GH.path});return f?f.sha:null}
async function ghLoad(){var txt="";
  if(ghTok){var r=await ghApi("/contents/"+GH.path+"?ref="+GH.branch,{headers:{"Accept":"application/vnd.github.raw+json"}});if(r.status==401){ghState="bad";throw new Error("token")}if(r.ok)txt=await r.text();ghSha=await ghGetSha()}
  else{var q=await fetch(GH.path+"?t="+Date.now(),{cache:"no-store"});if(q.ok)txt=await q.text()}
  var o=null;try{o=txt.trim()?JSON.parse(txt):null}catch(e){}
  if(o)fsMerge(o);
  seedAll();try{localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(BK,JSON.stringify(bw));localStorage.setItem(LK,JSON.stringify(S))}catch(e){}
  render()}
async function ghWrite(){if(ghBusy){ghAgain=true;return}ghBusy=true;ghState="saving";ghUi();
  try{for(var tries=0;tries<2;tries++){
      var body={message:"Update workout data "+new Date().toISOString().slice(0,16).replace("T"," "),content:b64(snap()),branch:GH.branch};if(ghSha)body.sha=ghSha;
      var r=await ghApi("/contents/"+GH.path,{method:"PUT",body:JSON.stringify(body)});
      if(r.ok){ghSha=(await r.json()).content.sha;ghState="on";break}
      if(r.status==401||r.status==403||r.status==404){ghState="bad";break}
      if(r.status==409||r.status==422){ghSha=await ghGetSha();continue}
      ghState="err";break}
    if(ghState=="saving")ghState="err"}
  catch(e){ghState="err"}
  ghBusy=false;ghUi();if(ghAgain){ghAgain=false;ghWrite()}}
function ghQueue(){if(!ghTok||ghState=="bad")return;clearTimeout(ghT);ghState="pending";ghUi();ghT=setTimeout(ghWrite,1500)}
function ghUi(){var b=$("ghb");if(!b)return;var t={off:["🔑 Connect GitHub to save your workouts",1],on:["✅ Saved to GitHub",0],pending:["⏳ Saving to GitHub…",0],saving:["⏳ Saving to GitHub…",0],
  err:["⚠️ Not saved to GitHub. Tap to retry",1],bad:["⚠️ GitHub key not working. Tap to enter a new one",1]}[ghTok?ghState:"off"];
  b.textContent=t[0];b.className=t[1]?"pri":"";b.title=ghTok?"Saving to github.com/"+GH.owner+"/"+GH.repo:""}
$("ghb").onclick=async function(){
  if(ghTok&&ghState=="err"){ghWrite();return}
  if(ghTok&&(ghState=="on"||ghState=="pending")){if(!confirm("Disconnect GitHub on this browser? Workouts will stop saving to GitHub here."))return;ghTok=null;try{localStorage.removeItem("workout-gh-token")}catch(e){}ghState="off";ghUi();return}
  var k=prompt("Paste your GitHub key (a fine-grained personal access token with Contents: Read and write on the \""+GH.repo+"\" repository). It is stored only in this browser.");
  if(!k)return;ghTok=k.trim();try{localStorage.setItem("workout-gh-token",ghTok)}catch(e){}ghState="pending";ghUi();
  try{await ghLoad();ghState="on";await ghWrite()}catch(e){ghState="bad";ghUi();alert("That key could not open the repository. Check it has Contents: Read and write on "+GH.owner+"/"+GH.repo+".")}};
seedAll();
render();
ghUi();
if(location.protocol!="file:")ghLoad().then(function(){if(ghTok)ghState="on";ghUi()}).catch(function(){ghUi()});
</script>
