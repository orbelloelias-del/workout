<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Calendar</title>
<style>
:root{--bg:#e4e7eb;--card:#eff1f4;--fg:#1c1f26;--mut:#5b6472;--line:#cfd4db;--acc:#16a34a;--accfg:#fff;--today:#d3ecdc;--done:#d9ebe0;--donebd:#8cc9a3;--wk:#e6f0ea;--fs-1:.618rem;--fs0:1rem;--fs1:1.618rem;--fs2:2.618rem;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1a1e25;--fg:#eceff4;--mut:#9aa3b2;--line:#2a303a;--acc:#22c55e;--accfg:#06240f;--today:#14321f;--done:#16301f;--donebd:#2f6b45;--wk:#242b35}}
:root[data-theme="dark"]{--bg:#111418;--card:#1a1e25;--fg:#eceff4;--mut:#9aa3b2;--line:#2a303a;--acc:#22c55e;--accfg:#06240f;--today:#14321f;--done:#16301f;--donebd:#2f6b45;--wk:#242b35}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
h1{font-size:var(--fs1);margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 12px}
button.pri,.seg button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.seg{display:flex}
.seg button{border-radius:0}
.seg button:first-child{border-radius:10px 0 0 10px}
.seg button:last-child{border-radius:0 10px 10px 0}
.nav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav b{flex:1;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;color:var(--mut);font-size:var(--fs0);padding:4px 0}
.day{min-height:78px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:start;min-width:0;overflow:hidden}
.day.empty{background:none;border:none;cursor:default}
.day.today{background:var(--today);border-color:var(--acc)}
.day.sel{outline:2px solid var(--acc)}
.labs{display:flex;flex-direction:column;gap:2px;width:100%}
.lab{font-size:var(--fs-1);line-height:1.15;background:var(--today);border-left:3px solid var(--acc);border-radius:4px;padding:1px 3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.panel{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h2{font-size:var(--fs1);margin:0 0 10px}
.item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.item small,.ex small{color:var(--mut);display:block;margin-top:2px}
.item button,.ex>button{padding:4px 10px;color:#dc2626;align-self:flex-start}
.row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.row>div{flex:1 1 40%}
input,select,textarea{font:inherit;width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.none{color:var(--mut);font-size:var(--fs0)}
.stat{color:var(--mut);font-size:var(--fs0);margin:10px 2px}
.bwl{font-size:var(--fs0);padding:4px 0 8px}
#wiz{margin-top:14px}
.wh{display:flex;justify-content:space-between;margin-bottom:10px}
.q{font-weight:600;margin:10px 0 6px}
.ex{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.ex>div{flex:1}
.lbl{font-size:var(--fs0);color:var(--mut);margin-top:6px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:var(--fs0)}
th,td{padding:8px 10px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600}
tr[data-k]{cursor:pointer}
tr[data-k]:hover{background:var(--bg)}
tr.first td{border-top:2px solid var(--line)}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tools button{flex:1 1 auto}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0}input[type=checkbox]{width:auto}
.item button.ed,.ex>button.ed{color:var(--fg)}
.bt{display:flex;gap:6px;align-self:flex-start}
.item>div:first-child{flex:1;min-width:0}
.ss{width:100%;box-sizing:border-box;align-self:stretch;border:2px solid var(--acc);border-radius:12px;padding:6px 12px 10px;margin:10px 0}.sst{display:block;color:var(--acc);font-weight:700}.ssh{display:flex;justify-content:space-between;align-items:center;gap:8px}.ssh .sst{flex:1}.ss .xl:first-child{margin-top:2px}
.xl{display:block;margin:6px 0}.xl u{color:var(--fg);text-underline-offset:2px}.xd{display:block;color:var(--mut)}
.lab.pl{background:none;border:1px dashed var(--mut);border-left:3px solid var(--mut);color:var(--mut)}
.pc{margin-top:12px;padding:10px;border:1px dashed var(--line);border-radius:10px}.pc small{display:block;color:var(--mut);margin:6px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.tile b{font-size:var(--fs1);display:block}.tile span{color:var(--mut);font-size:var(--fs-1);display:block}.tile small{color:var(--mut);font-size:var(--fs-1);display:block;margin-top:2px}
.stw{position:relative}.stw svg{width:100%;height:auto;display:block;touch-action:pan-y}.stw svg text{fill:var(--mut);font-size:var(--fs-1)}.stw svg text.lv{fill:var(--fg);font-weight:600}
.stt{position:absolute;top:0;display:none;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:var(--fs-1);line-height:1.4;box-shadow:0 2px 8px rgba(0,0,0,.18);white-space:nowrap;z-index:2}
.tr2{position:relative;display:flex;align-items:center;gap:8px;margin:6px 0;font-size:var(--fs0)}.tr2 span{width:90px;flex:none}.tr2 i{display:block;height:8px;border-radius:4px;background:var(--acc)}.tr2 b{font-weight:600}
em{color:var(--acc);font-style:normal;font-size:var(--fs-1)}
html{font-size:16px}body,button,input,select,textarea,small{font-size:var(--fs0)}h2,h3{font-size:var(--fs1)}
.item.wk{background:var(--wk);border:1px solid var(--donebd);border-radius:12px;padding:12px;margin:0 0 10px}
.item.wk>div>b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.day.done{background:var(--done);border-color:var(--donebd)}
.day.done .lab{background:var(--acc);color:var(--accfg);border-left-color:var(--accfg);font-weight:600}
#fsave{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;border-radius:999px;padding:12px 18px;box-shadow:0 4px 14px rgba(0,0,0,.18);font-weight:600}
@media (max-width:560px){
 .wrap{padding:10px 10px 80px}
 h1{font-size:var(--fs1)}
 header{gap:6px}
 .item.wk{flex-wrap:wrap}.item.wk>div:first-child{flex:1 1 100%;order:2}.item.wk>.bt{order:1;margin-left:auto}
 .seg{width:100%}.seg button{flex:1 1 0;padding:8px 2px;font-size:var(--fs0);min-width:0}
 .tools button{font-size:var(--fs0);padding:8px 10px}
 .day{min-height:62px;padding:3px;border-radius:8px}
 .lab{font-size:var(--fs-1);padding:1px 2px;letter-spacing:-.2px;word-break:normal;overflow-wrap:normal}
 .grid,.cal{gap:3px}
}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🏋️ Workout Calendar</h1>
    <button id="thb" title="Switch light / dark mode"></button><div class="seg"><button id="vc" class="on">Calendar</button><button id="vl">Log</button><button id="ve">Exercises</button><button id="vp">Plan</button><button id="vs">Stats</button></div></header>
  <div class="tools"><button class="pri" id="retro">＋ Log past workout</button><button id="goto">📅 Go to date</button></div>
  <div class="tools"><button id="cb"></button><button id="fsb"></button><button id="gcb" style="display:none"></button><button id="bkb" style="display:none">⬇️ Download backup</button><button id="imb" style="display:none">⬆️ Import backup</button><button id="fsave" style="display:none"></button><input type="file" id="imf" accept=".json,application/json" hidden></div>
  <div class="panel" id="dp" style="display:none;margin:0 0 12px"><div class="lbl" id="dpl" style="margin:0 0 6px"></div>
    <div class="row" style="margin:0"><input type="date" id="dpi" style="flex:1"><button class="pri" id="dpg">Go</button><button id="dpx">✕</button></div></div>
  <div id="cal">
    <div class="nav">
      <button id="prev" aria-label="Previous month">‹</button>
      <b id="title"></b>
      <button id="today">Today</button>
      <button id="next" aria-label="Next month">›</button>
    </div>
    <div class="grid" id="dows"></div>
    <div class="grid" id="grid" style="margin-top:4px"></div>
    <div class="stat" id="stat"></div>
    <div class="panel">
      <h2 id="ptitle"></h2>
      <div id="list"></div>
      <div id="wiz"></div>
    </div>
  </div>
  <div id="logv" style="display:none"></div>
  <div id="dbv" style="display:none"></div>
  <div id="plv" style="display:none"></div>
  <div id="stv" style="display:none"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var KEY="workout-calendar-v1",LK="workout-calendar-lib-v1",BK="workout-calendar-bw-v1";
var PATS=["Pull","Push","Squat","Hinge","Full body"];
var LIB={
Pull:["Pull ups","Rows","Cable pulls","Lat pulldown","Face pull","Bicep curls","Rear delt pulls","Concentration curls","Shrug"],
Push:["Bench press","Overhead press","Push-up","Dip","Chest fly","Lateral raise","Triceps extension"],
Squat:["Squat","Lunge","Split squat","Step-up","Leg press","Knee extension"],
Hinge:["Deadlift","Romanian deadlift","Hip thrust","Good morning","Back extension","Leg curl","Swing"]};
var EQ=["Machine","Barbell","Dumbbells","Kettlebell","Cable","Bar","Pulley","Bands","Bodyweight"];
function ld(k,d){try{return JSON.parse(localStorage.getItem(k)||"null")||d}catch(e){return d}}
var data={},bw={},S={types:[],mv:{},eq:[]};
try{[KEY,BK,LK,"workout-calendar-seed-v1","workout-calendar-seed-v2","workout-gh-token"].forEach(function(k){localStorage.removeItem(k)})}catch(e){}
S.types=S.types||[];S.mv=S.mv||{};S.eq=S.eq||[];S.ex=S.ex||[];
function save(){fsQueue();if(typeof cQueue=="function")cQueue()}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(k){var p=k.split("-");return MONTHS[+p[1]-1].slice(0,3)+" "+(+p[2])+", "+p[0]}
var now=new Date(),cur=new Date(now.getFullYear(),now.getMonth(),1),sel=iso(now),W=null,adding=null,mode="cal";
var $=function(i){return document.getElementById(i)};
$("dows").innerHTML=DOW.map(function(d){return '<div class="dow">'+d+'</div>'}).join("");

function nm(x){return x.cat?(x.cat+(x.sub?" · "+x.sub:"")):x.type}
function exLine(e,ss){var p=[];
  if(e.kg)p.push(esc(e.kg)+" kg");
  if(e.sets&&!e.g)p.push(esc(e.sets)+(e.sets==1?" set":" sets"));
  if(e.t)p.push(esc(e.t)+" s hold"+(e.iso?" each":""));
  if(e.reps)p.push(esc(e.reps)+(e.reps==1?" rep":" reps")+(e.iso?" each":""));
  if(e.rest)p.push("rest "+esc(e.rest)+(e.ru=="m"?" min":" s"));
  if(e.stars)p.push(esc(e.stars).replace(/\*/g,"★"));
  var g=[e.eq,e.pos,e.grip,e.det].filter(Boolean).map(esc).join(" · ");
  return '<span class="xl"><u>'+esc(e.name)+(g?" · "+g:"")+(e.iso?" · <em>isolateral</em>":"")+'</u>'+(p.length?'<span class="xd">'+p.join(" · ")+'</span>':"")+'</span>'}
function ssTitle(e){return 'Superset · '+esc(e.gr||e.sets||"")+(e.gr==1?" round":" rounds")}
function det(x){var d=[],l=[];
  if(x.dur)d.push(x.dur+" min");if(x.dist)d.push(x.dist+" km");
  if(d.length)l.push('<span class="xl">'+esc(d.join(" · "))+'</span>');
  if(x.ex){var gi=null;x.ex.forEach(function(e,i){
    if(e.g&&e.g!==gi)l.push('<div class="ss"><span class="sst">'+ssTitle(e)+'</span>');
    if(!e.g&&gi)l.push('</div>');
    if(e.g&&gi&&e.g!==gi){}
    l.push(exLine(e));gi=e.g||null;
    var nx2=x.ex[i+1];if(gi&&(!nx2||nx2.g!==gi)){l.push('</div>');gi=null}})}
  if(x.notes)l.push('<span class="xl"><i>'+esc(x.notes)+'</i></span>');
  return l.join("")}

function render(){
  var y=cur.getFullYear(),m=cur.getMonth();
  $("title").textContent=MONTHS[m]+" "+y;
  var first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),h="",total=0,active=0;
  for(var i=0;i<first;i++)h+='<div class="day empty"></div>';
  for(var d=1;d<=days;d++){
    var k=iso(new Date(y,m,d)),w=data[k]||[];
    if(w.length){active++;total+=w.length}
    h+='<button class="day'+(w.length?' done':'')+(k===iso(now)?' today':'')+(k===sel?' sel':'')+'" data-k="'+k+'"><span>'+d+'</span><span class="labs">'+
      w.slice(0,2).map(function(x){return '<span class="lab">'+esc(innerWidth<560?(x.sub||x.cat||x.type||nm(x)):nm(x))+'</span>'}).join("")+
      (w.length>2?'<span class="lab">+'+(w.length-2)+' more</span>':'')+(!w.length&&PLAN[k]?'<span class="lab pl">'+esc(PLAN[k].a||PLAN[k].t)+'</span>':'')+'</span></button>';
  }
  $("grid").innerHTML=h;
  $("stat").textContent=total?("This month: "+total+(total>1?" workouts":" workout")+" on "+active+(active>1?" days":" day")):"No workouts logged this month yet";
  $("cal").style.display=mode=="cal"?"":"none";
  $("logv").style.display=mode=="log"?"":"none";$("dbv").style.display=mode=="db"?"":"none";$("plv").style.display=mode=="plan"?"":"none";$("vp").className=mode=="plan"?"on":"";$("stv").style.display=mode=="stats"?"":"none";$("vs").className=mode=="stats"?"on":"";
  $("vc").className=mode=="cal"?"on":"";$("vl").className=mode=="log"?"on":"";$("ve").className=mode=="db"?"on":"";
  if(mode=="cal"){panel();wiz()}else if(mode=="log")logRender();else if(mode=="plan")planRender();else if(mode=="stats")statRender();else dbRender();
}
function panel(){
  var p=sel.split("-");
  $("ptitle").textContent="Workouts on "+MONTHS[+p[1]-1]+" "+(+p[2])+", "+p[0];
  var w=data[sel]||[];
  $("list").innerHTML=(bw[sel]?'<div class="bwl">⚖️ Body weight: '+esc(bw[sel])+' kg</div>':'')+
    (w.length?w.map(function(x){
      return '<div class="item wk"><div><b>'+esc(nm(x))+'</b><small>'+det(x)+'</small></div><div class="bt"><button class="ed" data-edit="'+x.id+'">Edit</button><button data-del="'+x.id+'">Delete</button></div></div>';
    }).join(""):'<div class="none">No workout logged for this date yet.</div>')+planCard();
}
function logRender(){
  var seen={},ks=Object.keys(data).concat(Object.keys(bw)).filter(function(k){if(seen[k])return false;seen[k]=1;return (data[k]&&data[k].length)||bw[k]}).sort().reverse();
  if(!ks.length){$("logv").innerHTML='<div class="none">Nothing logged yet.</div>';return}
  var h='<div class="tw"><table><thead><tr><th>Date</th><th>Workout</th><th>Details</th><th>Body weight</th></tr></thead><tbody>';
  ks.forEach(function(k){
    var w=data[k]||[],n=Math.max(w.length,1);
    for(var i=0;i<n;i++){var x=w[i];
      h+='<tr data-k="'+k+'"'+(i==0?' class="first"':'')+'><td>'+(i==0?fmt(k):'')+'</td><td>'+(x?'<b>'+esc(nm(x))+'</b>':'—')+'</td><td>'+(x?det(x):'')+'</td><td>'+(i==0&&bw[k]?esc(bw[k])+' kg':'')+'</td></tr>';
    }
  });
  $("logv").innerHTML=h+'</tbody></table></div>';
}

function q(t){return '<div class="q">'+esc(t)+'</div>'}
function libFor(s){return (LIB[s]||[]).concat(S.mv[s]||[])}
function eqList(){return EQ.concat(S.eq)}
function pick(act,ph,arr,curv,addlbl){
  return '<select data-s="'+act+'"><option value="">'+ph+'</option>'+arr.map(function(t){return '<option'+(t===curv?' selected':'')+'>'+esc(t)+'</option>'}).join("")+(addlbl?'<option value="__new">+ '+addlbl+'</option>':'')+'</select>'}
function addrow(kind,ph){return adding==kind?'<div class="row"><input id="na" placeholder="'+ph+'"><button data-a="add" data-k="'+kind+'">Add</button></div>':""}
function newW(){return {id:null,cat:null,sub:null,ex:[],notes:"",bw:null,f:null,fi:-1}}
function nx(e){var o=JSON.parse(JSON.stringify(e));if(o.rest&&o.ru!="m")o.rest=String(Math.round(o.rest/60*100)/100);o.ru="m";return o}
function names(){var o={},r=[];function a(n){if(n&&!o[n]){o[n]=1;r.push(n)}}
  var pp=W.cat=="Endurance"?"Core":W.sub;libFor(pp).forEach(a);S.ex.forEach(function(t){if(t.pat==pp)a(t.name)});Object.keys(data).forEach(function(k){data[k].forEach(function(x){(x.ex||[]).forEach(function(e){if(e.pat==pp)a(e.name)})})});return r}
function poss(){var r=["Seated","Standing","Lying","Incline","Kneeling","Bent over","Hanging"];Object.keys(data).forEach(function(k){data[k].forEach(function(x){(x.ex||[]).forEach(function(e){if(e.pos&&r.indexOf(e.pos)<0)r.push(e.pos)})})});return r}
function exRow(e,i){return '<div class="ex"><div>'+exLine(e)+'</div><button class="ed" data-a="edx" data-i="'+i+'">Edit</button><button data-a="rmex" data-i="'+i+'" aria-label="Remove">✕</button></div>'}
function exList(){if(!W.ex.length)return "";var h=q("Exercises so far"),i=0,ex=W.ex;
  while(i<ex.length){var e=ex[i];
    if(!e.g){h+=exRow(e,i);i++;continue}
    var g=e.g;h+='<div class="ss"><div class="ssh"><span class="sst">'+ssTitle(e)+'</span><label class="none">Rounds <input type="number" min="1" step="1" data-gr="'+esc(g)+'" value="'+esc(e.gr||e.sets||"")+'" style="width:60px"></label></div>';
    while(i<ex.length&&ex[i].g===g){h+=exRow(ex[i],i);i++}
    h+='<button data-a="addss" data-g="'+esc(g)+'" style="width:100%;margin-top:6px">+ Add exercise to this superset</button></div>'}
  return h}
function exForm(){var f=W.f,N='type="number" min="0" step="any" inputmode="decimal"';
  function F(k,l,x){return '<div><div class="lbl">'+l+'</div><input data-f="'+k+'" '+x+' value="'+esc(f[k]||"")+'"></div>'}
  function dl(id,a){return '<datalist id="'+id+'">'+a.map(function(t){return '<option value="'+esc(t)+'">'}).join("")+'</datalist>'}
  return q((f.g?"Superset · ":"")+(W.fi>=0?"Edit exercise":"New exercise"))+dl("mvl",names())+dl("eql",eqList())+dl("posl",poss())+
  '<div class="row">'+F("name","Movement",'list="mvl"')+F("eq","Equipment (optional)",'list="eql"')+'</div>'+
  '<div class="row">'+F("pos","Body position",'list="posl"')+'<div><div class="lbl">Wrist grip</div><select data-f="grip">'+["","Pronated","Supinated","Neutral"].map(function(g){return '<option value="'+g+'"'+(f.grip==g?' selected':'')+'>'+(g||"—")+'</option>'}).join("")+'</select></div>'+'</div><div class="row">'+F("det","Details (e.g. narrow grip)","")+'</div>'+
  '<label class="chk"><input type="checkbox" data-f="iso"'+(f.iso?' checked':'')+'> Isolateral (one side at a time)</label>'+
  '<div class="row">'+(f.g?(W.ex.some(function(e,i){return e.g===f.g&&i!==W.fi})?'':F("gr","Superset rounds",N)):F("sets","Sets",N))+F("reps","Reps"+(f.iso?" (each)":""),N)+F("t","Hold time (sec, optional)",N)+F("kg","Weight (kg)",N)+F("rest","Rest after (min)",N)+'</div>'+

// ---- Google Calendar: each logged workout becomes an all-day "X Workout" event ----
var GC_SCOPE="https://www.googleapis.com/auth/calendar.events",gTok=null,gExp=0;
try{gTok=sessionStorage.getItem("wc-gtok");gExp=+sessionStorage.getItem("wc-gexp")||0}catch(e){}
function gcProv(){var p=new firebase.auth.GoogleAuthProvider();p.addScope(GC_SCOPE);if(cuser&&cuser.email)p.setCustomParameters({login_hint:cuser.email});return p}
function gcKeep(r){var t=r&&r.credential&&r.credential.accessToken;if(!t)return false;gTok=t;gExp=Date.now()+55*60000;
  try{sessionStorage.setItem("wc-gtok",gTok);sessionStorage.setItem("wc-gexp",gExp)}catch(e){}return true}
function gcToken(){if(gTok&&Date.now()<gExp)return Promise.resolve(gTok);
  return firebase.auth().currentUser.reauthenticateWithPopup(gcProv()).then(function(r){if(!gcKeep(r))throw new Error("no token");return gTok})}
function gcTitle(w){var c=(w.cat||w.type||"").toLowerCase(),t;
  if(c=="endurance"||c=="cardio")t="Cardio";else if(c=="flexibility"||c=="mobility")t="Flexibility";else if(c=="core")t="Core";
  else if(c=="strength")t=w.sub||"Strength";else t=w.cat||w.type||"";
  return t+" Workout"}
function gcDesc(w){var L=[];if(w.dur)L.push(w.dur+" min"+(w.dist?" · "+w.dist+" km":""));
  (w.ex||[]).forEach(function(e){var a=[e.name+(e.eq?" ("+e.eq+")":"")];var r=e.t?e.t+" s hold":e.reps?e.reps+" reps":"";a.push((e.sets?e.sets+" × ":"")+r+(e.iso?" each":"")+(e.kg?" @ "+e.kg+" kg":""));L.push("• "+a.join(": "))});
  if(w.notes)L.push("",w.notes);return L.join("\n")}
function gcBody(w,k){var d=new Date(k+"T12:00:00");d.setDate(d.getDate()+1);return {summary:gcTitle(w),description:gcDesc(w),start:{date:k},end:{date:iso(d)},transparency:"transparent",colorId:"11"}}
async function gcCall(method,path,body){var tk=await gcToken();
  var r=await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events"+path,{method:method,headers:{"Authorization":"Bearer "+tk,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  if(r.status==401){gTok=null;gExp=0;throw new Error("expired")}
  if(r.status==403){var j={};try{j=await r.json()}catch(e){}var m=JSON.stringify(j);if(/accessNotConfigured|SERVICE_DISABLED|has not been used/.test(m))throw new Error("api-off");throw new Error("forbidden")}
  if(!r.ok&&!(method=="DELETE"&&(r.status==404||r.status==410)))throw new Error("http "+r.status);
  return method=="DELETE"?null:r.json()}
function gcFind(id){for(var k in data)for(var i=0;i<data[k].length;i++)if(String(data[k][i].id)===String(id))return [data[k][i],k];return null}
async function gcPush(id){var f=gcFind(id);if(!f)return;var w=f[0],k=f[1],ev=S.calev[id];
  var j=ev?await gcCall("PUT","/"+encodeURIComponent(ev),gcBody(w,k)):await gcCall("POST","",gcBody(w,k));
  S.calev[id]=j.id;S.calPend=S.calPend.filter(function(x){return String(x)!==String(id)})}
function gcErr(e){var m=e&&e.message;
  if(m=="api-off"){if(confirm("Google Calendar isn't switched on for this site yet. Open the page to turn it on? (Click Enable there, wait a minute, then tap the 📅 button again.)"))open("https://console.cloud.google.com/apis/library/calendar-json.googleapis.com?project=workout-log-3db1e","_blank")}
  else if(e&&(e.code=="auth/popup-closed-by-user"||e.code=="auth/cancelled-popup-request"))return;
  else if(e&&e.code=="auth/popup-blocked")alert("Your browser blocked the Google popup. Allow popups for this site and tap the 📅 button again.");
  else if(m=="expired")alert("Google Calendar access expired. Tap the 📅 button to reconnect.");
  else alert("Couldn't add to Google Calendar: "+(m||e))}
function gcSync(w,k){if(!S.calOn||!cuser)return;S.calev=S.calev||{};S.calPend=S.calPend||[];
  if(S.calPend.indexOf(w.id)<0)S.calPend.push(w.id);gcUi();
  gcPush(w.id).catch(gcErr).then(function(){save();gcUi()})}
function gcDel(id){if(!S.calOn||!S.calev||!S.calev[id])return;var ev=S.calev[id];delete S.calev[id];S.calPend=(S.calPend||[]).filter(function(x){return String(x)!==String(id)});
  gcCall("DELETE","/"+encodeURIComponent(ev)).catch(function(e){gcErr(e)})}
var gcProg="";
async function gcFlush(){var ids=(S.calPend||[]).slice();
  for(var i=0;i<ids.length;i++){gcProg=(i+1)+"/"+ids.length;gcUi();try{await gcPush(ids[i])}catch(e){gcProg="";gcErr(e);break}if(i%20==19)save();await new Promise(function(r){setTimeout(r,120)})}
  gcProg="";save();gcUi()}
function gcUi(){var b=$("gcb");if(!b)return;var on=!!(cuser&&cReady);b.style.display=on?"":"none";if(!on)return;
  var n=(S.calPend||[]).length;
  b.textContent=gcProg?"⏳ Adding to Google Calendar "+gcProg+"…":!S.calOn||!Object.keys(S.calev||{}).length&&!n?"📅 Add logged workouts to Google Calendar":n?"📅 Sync "+n+" workout"+(n>1?"s":"")+" to Google Calendar":"📅 Google Calendar: on";
  b.className=S.calOn&&n?"pri":"";b.title=S.calOn&&!n?"Tap to turn off":""}
$("gcb").onclick=function(){
  if(S.calOn&&!(S.calPend||[]).length&&Object.keys(S.calev||{}).length){if(confirm("Stop adding workouts to Google Calendar? Events already created stay in your calendar.")){S.calOn=false;save();gcUi()}return}
  var go=async function(){
    try{await gcCall("GET","?maxResults=1")}catch(e){gcErr(e);return}
    var first=!S.calOn||!Object.keys(S.calev||{}).length;S.calOn=true;S.calev=S.calev||{};S.calPend=S.calPend||[];
    if(first){var past=[];Object.keys(data).sort().forEach(function(k){data[k].forEach(function(w){if(!S.calev[w.id]&&S.calPend.indexOf(w.id)<0)past.push(w.id)})});
      if(past.length&&confirm("Google Calendar connected. New workouts will be added automatically.\n\nAlso add your "+past.length+" past workouts to the calendar now?"))S.calPend=S.calPend.concat(past)}
    save();gcUi();return gcFlush()};
  if(gTok&&Date.now()<gExp){go();return}
  firebase.auth().currentUser.reauthenticateWithPopup(gcProv()).then(function(r){gcKeep(r);return go()}).catch(gcErr)};
function cTools(){var on=!!(cuser&&cReady);gcUi();var f=$("fsave");f.style.display=on?"":"none";f.textContent={dirty:"💾 Save",err:"⚠️ Retry save",saving:"⏳ Saving…"}[cState]||"✅ Saved";f.className=(cState=="dirty"||cState=="err")?"pri":"";$("bkb").style.display=on?"":"none";$("imb").style.display=on?"":"none"}
$("fsave").onclick=function(){if(cuser&&cReady)cWrite()};
$("bkb").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([snap()],{type:"application/json"}));a.download="workout-data-"+iso(new Date())+".json";document.body.appendChild(a);a.click();a.remove()};
$("imb").onclick=function(){$("imf").value="";$("imf").click()};
$("imf").onchange=async function(){var f=this.files[0];if(!f)return;var o=null;try{o=JSON.parse(await f.text())}catch(e){}
  if(!o||!(o.data||(o.settings&&o.settings.plan))){alert("That file isn't a workout backup.");return}
  var n=Object.keys(o.data||{}).length,np=o.settings&&o.settings.plan?Object.keys(o.settings.plan).length:0;if(!confirm("Add this file to your account?"+(n?"\n• "+n+" days of workouts (workouts already in your account are kept)":"")+(np?"\n• a training plan of "+np+" days (replaces your current plan)":"")))return;
  fsMerge(o);PLAN=S.plan||{};seedAll();save();render();alert("Imported. Your account now has "+Object.keys(data).length+" days with workouts and "+Object.keys(PLAN).length+" planned days.")};
function cInit(){
  if(!window.firebase){cState="na";cUi();return}
  firebase.initializeApp(FB_CFG);
  firebase.auth().onAuthStateChanged(function(u){if(u)cStart(u);else{if(cref)cref.off();cuser=null;cref=null;cReady=false;cState="off";cUi();cClear()}});
  $("cb").onclick=function(){
    if(cState=="err"||cState=="dirty"){cWrite();return}
    if(cuser){if(confirm("Sign out on this device? Your workouts stay saved in your account."))firebase.auth().signOut();return}
    var p=new firebase.auth.GoogleAuthProvider();cState="loading";cUi();
    firebase.auth().signInWithPopup(p).catch(function(e){if(e&&(e.code=="auth/popup-blocked"||e.code=="auth/operation-not-supported-in-this-environment"))return firebase.auth().signInWithRedirect(p);
      cState="off";cUi();if(e&&e.code!="auth/popup-closed-by-user"&&e.code!="auth/cancelled-popup-request")alert("Sign-in failed: "+(e.message||e))})}}
seedAll();
render();
cUi();
if(location.protocol!="file:")cInit();
</script>
